<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #9A6E20; } a:hover { color: #16150F; }
    button { font-family: inherit; }
    input { font-family: inherit; }
  </style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F4F2ED; color: #16150F; display: flex; flex-direction: column;">

  <div style="background: #FFFFFF; border-bottom: 1px solid #DCD8CF; padding: 10px 0;">
    <div style="width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px;">
      <input value="{{ name }}" onChange="{{ onName }}" placeholder="Name this chord" aria-label="Chord name" style="flex: 1 1 auto; min-width: 0; min-height: 46px; padding: 0; border: 0; background: transparent; color: #16150F; font-size: 22px; font-weight: 500;">
      <button type="button" onClick="{{ clearAll }}" style="flex: 0 0 auto; min-height: 46px; padding: 0 14px; border: 0; background: transparent; color: #7A776C; font-size: 15px; cursor: pointer;">Clear</button>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 0;">

    <!-- FROZEN PLATE — identical in every artboard. -->
    <div style="width: 420px; background: #FFFFFF; border: 1px solid #16150F;">
      <svg viewBox="0 0 320 370" width="100%" role="img" aria-label="C chord diagram" style="display: block;">
        <rect x="0" y="0" width="320" height="370" fill="#FFFFFF"></rect>
        <text x="160" y="52" text-anchor="middle" fill="#16150F" font-family="Georgia, 'Times New Roman', serif" font-size="30">{{name}}</text>
        <line x1="28" y1="96" x2="248" y2="96" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="146" x2="248" y2="146" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="196" x2="248" y2="196" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="246" x2="248" y2="246" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="296" x2="248" y2="296" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="346" x2="248" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <rect x="28" y="91.5" width="220" height="9" fill="{{nutFill}}"></rect>
        <line x1="248" y1="96" x2="248" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="204" y1="96" x2="204" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="160" y1="96" x2="160" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="116" y1="96" x2="116" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="72" y1="96" x2="72" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="96" x2="28" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <text x="268" y="121" text-anchor="start" dominant-baseline="central" fill="#16150F" font-family="Georgia, 'Times New Roman', serif" font-size="20">{{fretLabel}}</text>
        <circle cx="248" cy="79" r="8" fill="none" stroke="#16150F" stroke-width="2.5"></circle>
        <circle cx="160" cy="79" r="8" fill="none" stroke="#16150F" stroke-width="2.5"></circle>
        <line x1="20.5" y1="71.5" x2="35.5" y2="86.5" stroke="#16150F" stroke-width="2.5" stroke-linecap="round"></line>
        <line x1="20.5" y1="86.5" x2="35.5" y2="71.5" stroke="#16150F" stroke-width="2.5" stroke-linecap="round"></line>
        <circle cx="72" cy="221" r="14" fill="#16150F"></circle>
        <circle cx="116" cy="171" r="14" fill="#16150F"></circle>
        <circle cx="204" cy="121" r="14" fill="#16150F"></circle>
      </svg>
    </div>
    <!-- /FROZEN PLATE -->
  </div>

  <!-- The whole neck fits in one row at this width — no scrolling. -->
  <div style="background: #FFFFFF; border-top: 1px solid #DCD8CF; padding: 20px 0 26px;">
    <div style="width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;">

      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #7A776C;">Position</span>
        <span style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">{{fretLabel}}</span>
      </div>

      <div style="display: flex; gap: 6px;">
        <sc-for list="{{frets}}" as="f" hint-placeholder-count="17">
          <button type="button" onClick="{{ f.pick }}" aria-label="{{ f.label }}" style="flex: 0 0 auto; width: 46px; height: 48px; border-radius: 0; cursor: pointer; font-size: 16px; font-variant-numeric: tabular-nums; border: 1px solid {{f.bc}}; background: {{f.bg}}; color: {{f.fg}}">{{f.n}}</button>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 16px;">
        <button type="button" onClick="{{ toggleBarre }}" aria-pressed="{{ barre }}" style="flex: 0 0 auto; min-height: 46px; padding: 0 20px; border-radius: 0; cursor: pointer; font-size: 15px; font-weight: 500; border: 1px solid {{barreBorder}}; background: {{barreBg}}; color: {{barreFg}}">Barre</button>
        <span style="flex: 1 1 auto; min-height: 1.4em; font-size: 14px; color: #7A776C;">{{hintText}}</span>
        <button type="button" style="flex: 0 0 auto; min-width: 220px; min-height: 52px; border: 1px solid #16150F; border-radius: 0; background: #16150F; color: #FFFFFF; font-size: 17px; font-weight: 500; cursor: pointer;">Make my chord</button>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fret: 1, name: 'C', barre: false };
  }

  renderVals() {
    const s = this.state;
    const frets = [];
    for (let i = 1; i <= 17; i++) {
      const on = i === s.fret;
      frets.push({
        n: i,
        label: 'Fret ' + i,
        bg: on ? '#16150F' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#16150F',
        bc: on ? '#16150F' : '#DCD8CF',
        pick: () => this.setState({ fret: i }),
      });
    }
    return {
      name: s.name,
      fretLabel: s.fret + 'fr',
      nutFill: s.fret === 1 ? '#16150F' : 'none',
      frets: frets,
      barre: s.barre,
      barreBg: s.barre ? '#F6EDDC' : '#FFFFFF',
      barreFg: s.barre ? '#9A6E20' : '#16150F',
      barreBorder: s.barre ? '#9A6E20' : '#DCD8CF',
      hintText: s.barre ? 'Tap the two ends of the barre.' : '',
      toggleBarre: () => this.setState({ barre: !s.barre }),
      clearAll: () => this.setState({ name: '', barre: false }),
      onName: (e) => this.setState({ name: e.target.value }),
    };
  }
}
</script>
</body>
</html>
