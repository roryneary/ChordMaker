<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #C79A4A; } a:hover { color: #E8E6E0; }
    button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #14130E; color: #E8E6E0; display: flex; flex-direction: column;">

  <div style="padding: 20px 16px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <span style="text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; font-weight: 500; color: #8E8A7C;">Chord diagram builder</span>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #55523F;">{{fretLabel}}</span>
  </div>

  <!-- The plate is the only lit thing on the bench. -->
  <div style="flex: 1 1 auto; display: flex; align-items: flex-start; justify-content: center; padding: 8px 28px 0; min-height: 0;">

    <!-- FROZEN PLATE — identical in every artboard. -->
    <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #16150F; box-shadow: 0 22px 48px rgba(0, 0, 0, 0.6);">
      <svg viewBox="0 0 320 370" width="100%" role="img" aria-label="C chord diagram" style="display: block;">
        <rect x="0" y="0" width="320" height="370" fill="#FFFFFF"></rect>
        <text x="160" y="52" text-anchor="middle" fill="#16150F" font-family="Georgia, 'Times New Roman', serif" font-size="30">{{name}}</text>
        <line x1="28" y1="96" x2="248" y2="96" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="146" x2="248" y2="146" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="196" x2="248" y2="196" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="246" x2="248" y2="246" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="296" x2="248" y2="296" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="346" x2="248" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <rect x="28" y="91.5" width="220" height="9" fill="{{nutFill}}"></rect>
        <line x1="248" y1="96" x2="248" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="204" y1="96" x2="204" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="160" y1="96" x2="160" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="116" y1="96" x2="116" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="72" y1="96" x2="72" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <line x1="28" y1="96" x2="28" y2="346" stroke="#16150F" stroke-width="2.5" stroke-linecap="square"></line>
        <text x="268" y="121" text-anchor="start" dominant-baseline="central" fill="#16150F" font-family="Georgia, 'Times New Roman', serif" font-size="20">{{fretLabel}}</text>
        <circle cx="248" cy="79" r="8" fill="none" stroke="#16150F" stroke-width="2.5"></circle>
        <circle cx="160" cy="79" r="8" fill="none" stroke="#16150F" stroke-width="2.5"></circle>
        <line x1="20.5" y1="71.5" x2="35.5" y2="86.5" stroke="#16150F" stroke-width="2.5" stroke-linecap="round"></line>
        <line x1="20.5" y1="86.5" x2="35.5" y2="71.5" stroke="#16150F" stroke-width="2.5" stroke-linecap="round"></line>
        <circle cx="72" cy="221" r="14" fill="#16150F"></circle>
        <circle cx="116" cy="171" r="14" fill="#16150F"></circle>
        <circle cx="204" cy="121" r="14" fill="#16150F"></circle>
      </svg>
    </div>
    <!-- /FROZEN PLATE -->
  </div>

  <!-- The bench: a raised control deck. -->
  <div style="background: #1E1C14; border-top: 1px solid #3A3628; padding: 18px 16px 26px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: #8E8A7C;">Position</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums;">{{fretLabel}}</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button type="button" onClick="{{ dec }}" disabled="{{ atMin }}" aria-label="Move down one fret" style="width: 60px; height: 52px; border: 1px solid #3A3628; background: #262318; font-size: 22px; cursor: pointer; color: {{decColor}}">&minus;</button>
        <button type="button" onClick="{{ inc }}" disabled="{{ atMax }}" aria-label="Move up one fret" style="width: 60px; height: 52px; border: 1px solid #3A3628; background: #262318; font-size: 22px; cursor: pointer; color: {{incColor}}">+</button>
      </div>
    </div>

    <div style="height: 1px; background: #3A3628;"></div>

    <button type="button" onClick="{{ toggleBarre }}" aria-pressed="{{ barre }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%;">
      <span style="text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: #8E8A7C;">Barre</span>
      <span style="position: relative; width: 56px; height: 32px; border-radius: 16px; flex: 0 0 auto; background: {{trackColor}}">
        <span style="position: absolute; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: #E8E6E0; left: {{knobLeft}}"></span>
      </span>
    </button>

    <p style="margin: -6px 0 0; min-height: 1.4em; font-size: 13px; color: #8E8A7C;">{{hintText}}</p>

    <div style="display: flex; gap: 8px;">
      <button type="button" onClick="{{ clearAll }}" style="flex: 0 0 auto; min-width: 104px; min-height: 52px; border: 1px solid #3A3628; background: transparent; color: #8E8A7C; font-size: 15px; cursor: pointer;">Clear</button>
      <button type="button" onClick="{{ openSheet }}" style="flex: 1 1 auto; min-height: 52px; border: 1px solid #9A6E20; background: #9A6E20; color: #14130E; font-size: 16px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer;">Make my chord</button>
    </div>
  </div>

  <sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(5, 5, 3, 0.66); display: flex; align-items: flex-end; justify-content: center;">
      <div style="width: 100%; background: #1E1C14; border-top: 1px solid #3A3628; padding: 20px 16px 26px; display: flex; flex-direction: column; gap: 12px;">
        <span style="text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: #8E8A7C;">Chord name</span>
        <input value="{{ draft }}" onChange="{{ onDraft }}" placeholder="D Maj13" style="min-height: 48px; padding: 0 12px; border: 1px solid #3A3628; border-radius: 0; background: #14130E; color: #E8E6E0; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-size: 17px;">
        <div style="display: flex; gap: 8px;">
          <button type="button" onClick="{{ closeSheet }}" style="flex: 1 1 auto; min-height: 48px; border: 1px solid #3A3628; background: transparent; color: #8E8A7C; font-size: 16px; cursor: pointer;">Cancel</button>
          <button type="button" onClick="{{ saveSheet }}" style="flex: 1 1 auto; min-height: 48px; border: 1px solid #9A6E20; background: #9A6E20; color: #14130E; font-size: 16px; font-weight: 500; cursor: pointer;">Save PNG</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fret: 1, name: 'C', barre: false, sheet: false, draft: 'C' };
  }

  renderVals() {
    const s = this.state;
    const atMin = s.fret <= 1;
    const atMax = s.fret >= 17;
    return {
      name: s.name,
      fretLabel: s.fret + 'fr',
      nutFill: s.fret === 1 ? '#16150F' : 'none',
      barre: s.barre,
      trackColor: s.barre ? '#9A6E20' : '#3A3628',
      knobLeft: s.barre ? '28px' : '4px',
      hintText: s.barre ? 'Tap the two ends of the barre.' : '',
      atMin: atMin,
      atMax: atMax,
      decColor: atMin ? '#55523F' : '#E8E6E0',
      incColor: atMax ? '#55523F' : '#E8E6E0',
      sheet: s.sheet,
      draft: s.draft,
      dec: () => this.setState({ fret: Math.max(1, s.fret - 1) }),
      inc: () => this.setState({ fret: Math.min(17, s.fret + 1) }),
      toggleBarre: () => this.setState({ barre: !s.barre }),
      clearAll: () => this.setState({ name: '', barre: false }),
      openSheet: () => this.setState({ sheet: true, draft: s.name }),
      closeSheet: () => this.setState({ sheet: false }),
      saveSheet: () => this.setState({ name: s.draft, sheet: false }),
      onDraft: (e) => this.setState({ draft: e.target.value }),
    };
  }
}
</script>
</body>
</html>
